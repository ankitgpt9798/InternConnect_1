# Render Blueprint for InternConnect. Render > New > Blueprint > this repository.
# One Web Service runs the API and serves the built React app from the same address, which the session cookies need.
# Secrets are NOT stored here: every "sync: false" variable is typed in the Render dashboard when the Blueprint is
# created (or later under Environment). Local development settings stay in backend/.env (see backend/.env.example).
services:
  - type: web
    name: internconnect
    runtime: node
    plan: free # Free: sleeps after 15 minutes without visits; the next visit takes about a minute to wake it.
    region: singapore
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render puts more than one proxy in front of the app, all on private addresses. Trusting only private-network
      # proxies (not a fixed count) gives the student's real public IP address to the sign-in limits, new-IP alerts and
      # login history (Module 6). Verified on Render: Profile > Security shows the visitor's public IP.
      - key: TRUST_PROXY
        value: 'loopback, linklocal, uniquelocal'
      # The site's own https address on Render, e.g. https://internconnect.onrender.com
      - key: CLIENT_URL
        sync: false
      # The same Atlas connection string as in backend/.env (database internconnect_new)
      - key: MONGODB_URI
        sync: false
      # Brevo SMTP: sign-in codes, password reset codes and invoices go to each student's own email address.
      # Encrypted connection (STARTTLS required on 2525, certificate checked). The server refuses to start without these.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: '2525'
      # Brevo > SMTP & API > SMTP: the "Login" (…@smtp-brevo.com) and an SMTP key
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # The sender verified in Brevo, e.g. InternConnect <your-project-mailbox@gmail.com>
      - key: EMAIL_FROM
        sync: false
      # Razorpay Test Mode keys only (rzp_test_...); live keys are refused by the server
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Cloudinary (photos and videos in Public Space)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
