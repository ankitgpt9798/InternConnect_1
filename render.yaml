# Render Blueprint for the InternConnect demo. Render > New > Blueprint > this repository.
# One Web Service runs the API and serves the built React app from the same address, which the session cookies need.
# Secrets are NOT stored here: every "sync: false" variable is typed in the Render dashboard when the Blueprint is
# created (or later under Environment). Local development settings stay in backend/.env (see backend/.env.example).
services:
  - type: web
    name: internconnect
    runtime: node
    plan: free # Free: sleeps after 15 minutes without visits; the next visit takes about a minute to wake it.
    region: singapore
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's proxy sits in front of the app; trusting one proxy gives the student's real IP address to the
      # sign-in limits and login history (Module 6). Check the IP shown in Profile > Security after the first login.
      - key: TRUST_PROXY
        value: '1'
      # The site's own https address on Render, e.g. https://internconnect.onrender.com
      - key: CLIENT_URL
        sync: false
      # The same Atlas connection string as in backend/.env (database internconnect_new)
      - key: MONGODB_URI
        sync: false
      # Mailtrap Email Testing: sign-in codes, new passwords and invoices are read in the Mailtrap inbox
      - key: MAILTRAP_USER
        sync: false
      - key: MAILTRAP_PASS
        sync: false
      # Razorpay Test Mode keys only (rzp_test_...); live keys are refused by the server
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Cloudinary (photos and videos in Public Space)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
