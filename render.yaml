# Render Blueprint for InternConnect (production). Render > New > Blueprint > this repository.
# One Web Service runs the API and serves the built React app from the same address, which the session cookies need.
# Secrets are NOT stored here: every "sync: false" variable is typed in the Render dashboard when the Blueprint is
# created (or later under Environment). Development settings stay in backend/.env (see backend/.env.example).
services:
  - type: web
    name: internconnect
    runtime: node
    plan: free # Free: sleeps after 15 minutes without visits. Change only after deciding on a paid plan.
    region: singapore
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's proxy sits in front of the app; trusting one proxy gives the student's real IP address to the
      # sign-in limits and login history (Module 6). Check the IP shown in Profile > Security after the first login.
      - key: TRUST_PROXY
        value: '1'
      # The site's own https address on Render, e.g. https://internconnect.onrender.com
      - key: CLIENT_URL
        sync: false
      # Atlas connection string ending in /internconnect_prod (the production database, separate from development)
      - key: MONGODB_URI
        sync: false
      # Brevo SMTP (real email delivery for sign-in codes, new passwords and invoices)
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # A sender verified in Brevo, e.g. InternConnect <no-reply@your-domain.com>
      - key: EMAIL_FROM
        sync: false
      # Razorpay Test Mode keys only (rzp_test_...); live keys are refused by the server
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Cloudinary (photos and videos in Public Space)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
